[package]
name = "servo-integration"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "servo-integration"
path = "src/main.rs"

[dependencies]
gl = "0.14"
url = "2.5.2"
smol = "2.0.2"
glow = "0.16.0"
gleam = "0.15.1"
image = "0.25.8"
winit = "0.30"
rustls = "0.23"
euclid = "0.22.11"
surfman = "0.10.0"

wgpu-hal = "26.0.1"
wgpu-core = "26.0.1"
wgpu = { version = "26.0", features = ["metal"] }

metal = { version = "0.32.0", optional = true }
foreign-types-shared = "0.3.1"

objc2 = { version = "0.6.2", optional = true}
objc2-io-surface = { version = "0.3.1", optional = true }
objc2-foundation = { version = "0.3.1", optional = true }
objc2-metal = { version = "0.3.1", features = [
    "MTLDevice",
    "MTLAllocation",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
], optional = true }

# Force newer termcolor to be compatible with naga v26
termcolor = "1.4"

slint = { git = "https://github.com/slint-ui/slint", rev = "07c2f2569825388ed7927cc56ed8ae1837d0ea49", features = [
    "unstable-wgpu-26",
    "unstable-winit-030",
] }

webrender_api = { git = "https://github.com/servo/webrender", branch = "0.67" }

libservo = { git = "https://github.com/servo/servo", rev = "af7de5ccf141c7cbb8a3792faeef916cdfa3dfc7" }
embedder_traits = { git = "https://github.com/servo/servo", rev = "af7de5ccf141c7cbb8a3792faeef916cdfa3dfc7", features = [
    "baked-default-resources",
] }
ash = "0.38.0"

[target.'cfg(target_os = "linux")'.dependencies]
khronos-egl = { version = "6.0.0" }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "07c2f2569825388ed7927cc56ed8ae1837d0ea49" }

[patch.crates-io]
wgpu = { path = "../wgpu/wgpu" }
wgpu-hal = { path = "../wgpu/wgpu-hal" }
wgpu-core = { path = "../wgpu/wgpu-core" }
wgpu-types = { path = "../wgpu/wgpu-types" }