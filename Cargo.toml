[package]
name = "servo-integration"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "servo-integration"
path = "src/main.rs"

[lib]
name = "servo_integration_lib"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
gl = "0.14.0"
url = "2.5.7"
smol = "2.0.2"
glow = "0.16.0"
rustls = "0.23.32"
gleam = "0.15.1"
image = "0.25.8"
winit = "0.30.12"
rustls = "0.23.32"
euclid = "0.22.11"
surfman = "0.10.0"
time-now = "0.1.2"
termcolor = "1.4.1"
thiserror = "2.0.17"
foreign-types-shared = "0.3.1"

wgpu-hal = "26.0.4"
wgpu-core = "26.0.1"
wgpu = { version = "26.0.1", features = ["metal"] }

webrender_api = { git = "https://github.com/servo/webrender", branch = "0.67" }

libservo = { git = "https://github.com/servo/servo", rev = "af7de5ccf141c7cbb8a3792faeef916cdfa3dfc7" }
embedder_traits = { git = "https://github.com/servo/servo", rev = "af7de5ccf141c7cbb8a3792faeef916cdfa3dfc7", features = [
    "baked-default-resources",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38.0"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.13.1", features = ["backend-android-activity-06"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.13.1", features = [
    "unstable-winit-030",
    "unstable-wgpu-26",
] }

[target.'cfg(target_vendor = "apple")'.dependencies]
metal = "0.32.0"
objc2 = "0.6.3"
objc2-io-surface = "0.3.2"
objc2-foundation = "0.3.2"
objc2-metal = { version = "0.3.2", features = [
    "MTLDevice",
    "MTLAllocation",
    "MTLResource",
    "MTLTexture",
    "objc2-io-surface",
] }

[build-dependencies]
slint-build = { version = "1.13.1" }

[target.'cfg(target_os = "linux")'.build-dependencies]
gl_generator = "0.14.0"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"